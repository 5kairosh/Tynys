name: Tynys tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r site/requirements.txt pytest pypdf httpx
      - run: .venv/bin/python -m pytest site/tests -q
