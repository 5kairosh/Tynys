name: Tynys tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            site/requirements.txt
            training/requirements-training.txt
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r training/requirements-training.txt pytest pypdf httpx
      - run: .venv/bin/python -m pytest site/tests training/tests -q
